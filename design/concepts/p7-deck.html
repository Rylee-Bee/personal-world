<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deck — Station packet 7</title>
<style>
  @font-face{font-family:"Fraunces";src:url("assets/fraunces-italic-latin.woff2") format("woff2");font-style:italic;font-weight:400}
  @font-face{font-family:"Fraunces";src:url("assets/fraunces-normal-latin.woff2") format("woff2");font-style:normal;font-weight:400}
  :root{--ink:#f4efe6;--dim:#b8b0a2;--faint:#877f71;--line:rgba(244,239,230,.16);
        --teal:#7fd0c8;--gold:#d3b06a;--canvas:#08080d;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .hero{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9;
    transition:opacity .45s ease}
  .hero.gone{opacity:0}
  @media (prefers-reduced-motion:reduce){.hero{transition:none}}
  .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(8,8,13,.72) 0%,rgba(8,8,13,.28) 34%,rgba(8,8,13,.55) 62%,rgba(8,8,13,.96) 100%)}
  .chrome{position:absolute;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:center;
    padding:10px 18px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
  .top{top:0} .bot{bottom:0;color:var(--faint);background:linear-gradient(0deg,rgba(8,8,13,.9),transparent)}
  .brand{color:var(--teal)} .pkt{color:var(--gold)}
  /* hero words */
  .words{position:absolute;left:6%;top:15%;z-index:5;text-align:left;width:min(50vw,540px)}
  .words .no{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .words h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:clamp(34px,6.4vw,60px);margin:6px 0 0;line-height:1.05}
  .words .does{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:clamp(16px,2.2vw,21px);color:var(--dim);margin:8px 0 0}
  .words .say{font-size:16px;color:#e3ddd1;margin:14px auto 0;max-width:46ch}
  .words .facts{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:16px 0 0;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .words .facts b{color:var(--teal);font-weight:400}
  /* the figure */
  .figwrap{position:absolute;left:0;right:0;top:26%;height:44%;display:flex;justify-content:flex-end;
    align-items:flex-end;padding-right:9%;z-index:4;pointer-events:none}
  .figwrap img{height:100%;width:auto;max-width:26vw;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8))}
  .figwrap img.round{border-radius:50%;height:78%;object-fit:cover;object-position:center 22%;border:1px solid var(--line)}
  /* fan */
  .hand{position:absolute;left:0;right:0;bottom:62px;height:250px;z-index:7}
  .card{position:absolute;left:50%;bottom:0;width:150px;height:212px;border-radius:11px;overflow:hidden;
    border:1px solid var(--line);background:#0d0d14;cursor:pointer;padding:0;
    box-shadow:0 14px 30px rgba(0,0,0,.6);transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
  .card .face{position:absolute;inset:0;background-size:cover;background-position:center}
  .card .face::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,13,.05),rgba(8,8,13,.82) 66%)}
  .card .top-rule{position:absolute;left:10px;right:10px;top:8px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55;z-index:2}
  .card .cap{position:absolute;left:0;right:0;bottom:0;padding:9px 10px;z-index:2}
  .card .cap .nm{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block}
  .card .cap .ds{font-size:10.5px;color:var(--dim);display:block;margin-top:2px}
  .card .pip{position:absolute;left:10px;top:12px;z-index:2;font-family:var(--mono);font-size:10px;
    letter-spacing:.12em;color:var(--gold)}
  .card:hover{border-color:var(--teal)}
  .card:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .card[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 22px 44px rgba(0,0,0,.7)}
  .card[aria-pressed="true"] .cap .nm{color:var(--gold)}
  .hint{position:absolute;left:18px;bottom:8px;z-index:8;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .hint b{color:var(--teal);font-weight:400}
  @media (max-width:820px){
    .words{top:9%;width:88vw}
    .figwrap{top:32%;height:30%;padding-right:3%}
    .figwrap img{max-width:44vw}
    .card{width:112px;height:160px}
    .hand{bottom:56px;height:190px}
    .card .cap .ds{display:none}
  }
@media (max-width:640px){.chrome{font-size:10px;letter-spacing:.08em;gap:10px}
    .pkt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;text-align:right}}
</style>
</head>
<body>
<div class="hero" id="hero" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<div class="chrome top"><span class="brand">✦ Project Worlds</span><span>The Deck</span><span class="pkt">Packet 7 / 8 · A hand of rooms</span></div>

<div class="words">
  <p class="no" id="wNo">Deck One</p>
  <h1 id="wName">The Bridge</h1>
  <p class="does" id="wDoes">what needs you</p>
  <p class="say" id="wSay"></p>
  <p class="facts" id="wFacts"></p>
</div>

<div class="figwrap" id="figwrap" aria-hidden="true"></div>
<div class="hand" id="hand" role="group" aria-label="Station decks, as a hand of cards"></div>

<div class="chrome bot"><span id="foot">The Bridge · Renai aboard</span><span>Pick a card · ← →</span></div>

<script>
const DECKS=[
 {no:'Deck One',name:'The Bridge',does:'what needs you',pip:'I',bg:'../assets/station/backgrounds/bridgebg.png',
  fig:'../assets/station/characters/renai.png',say:'Good evening. Nothing needs you right now.',
  facts:[['State','quiet'],['Changed','3'],['Resident','Renai']]},
 {no:'Deck Two',name:'Engineering',does:'systems & capabilities',pip:'II',bg:'../assets/station/backgrounds/engineeringbg.png',
  fig:'../assets/station/characters/hekek.png',say:'Kept well, not kept pretty. Everything holds.',
  facts:[['Capabilities','healthy'],['Providers','2'],['Resident','Hekek']]},
 {no:'Deck Three',name:'The Workshop',does:'making things',pip:'III',bg:'../assets/station/backgrounds/placesbg.png',
  fig:'../assets/station/characters/bolt.png',say:'Two on the bench. One is being stubborn, which Bolt respects.',
  facts:[['In flight','2'],['Quiet','1'],['Resident','Bolt']]},
 {no:'Deck Four',name:'The Archives',does:'memory & lore',pip:'IV',bg:'../assets/station/backgrounds/maproom.png',
  fig:'../assets/station/characters/ratatoskr.png',say:'Everything you have written, kept where you can find it.',
  facts:[['Memory','current'],['New entries','2'],['Resident','Ratatoskr']]},
 {no:'Deck Five',name:'The Galley',does:'stories & news',pip:'V',bg:'../assets/station/backgrounds/mediabg.png',
  fig:'../assets/station/characters/burrito.png',say:'The truck is parked. Two stories came home, neither shouting.',
  facts:[['Breaking','nothing'],['Stories','2'],['Resident','Burrito Journalism']]},
 {no:'Deck Six',name:'The Observatory',does:'the map of your world',pip:'VI',bg:'../assets/station/backgrounds/observeatorybg.png',
  fig:'../assets/station/characters/mira.png',say:'I forgot the name, but I remember the shape.',
  facts:[['Patterns','quiet'],['Signals','3'],['Resident','Mira']]},
 {no:'Deck Seven',name:'The Vault',does:'secrets & backups',pip:'VII',bg:'../assets/station/backgrounds/vaultbg.png',
  fig:'../assets/station/characters/bruma.png',say:'I kept that safe for you. Everything has its provenance.',
  facts:[['Preserved','yes'],['Provenance','complete'],['Resident','Bruma']]},
 {no:'Deck Eight',name:'Your Quarters',does:'rest & profile',pip:'VIII',bg:'../assets/station/backgrounds/quarters.png',
  fig:'../assets/station/icons/bedicon.png',say:'The door is yours. No one lives here unless you ask them to.',
  facts:[['Resident','none, by choice'],['Motion','reduced'],['Door','yours']]}
];
const hand=document.getElementById('hand');
const cards=[];
DECKS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='card';
  b.setAttribute('aria-pressed','false');
  b.setAttribute('aria-label',d.name+', '+d.does);
  b.innerHTML='<span class="face" style="background-image:url(\''+d.bg+'\')"></span><span class="top-rule"></span>'+
    '<span class="pip">'+d.pip+'</span><span class="cap"><span class="nm">'+d.name+'</span><span class="ds">'+d.does+'</span></span>';
  b.addEventListener('click',()=>pick(i));
  hand.appendChild(b);cards.push(b);
});
let cur=-1;
function layout(){
  const n=DECKS.length, w=hand.clientWidth;
  const cw=window.innerWidth<820?112:150;
  const gap=Math.max(26,Math.min(112,(w-cw-36)/(n-1)));
  const mid=(n-1)/2;
  cards.forEach((c,i)=>{
    const dist=Math.abs(i-cur);
    const off=(i-mid)*gap;
    const rot=(i-mid)*3.4;
    const lift=dist*5 + (i===cur?-32:0);
    const scale=i===cur?1.08:1;
    c.style.zIndex=100-dist;
    c.style.transform='translateX(calc(-50% + '+off+'px)) translateY('+lift+'px) rotate('+rot+'deg) scale('+scale+')';
  });
}
function pick(i){
  cur=(i+DECKS.length)%DECKS.length;
  const d=DECKS[cur];
  cards.forEach((c,k)=>c.setAttribute('aria-pressed',k===cur?'true':'false'));
  const hero=document.getElementById('hero');
  hero.classList.add('gone');
  setTimeout(()=>{hero.style.backgroundImage="url('"+d.bg+"')";hero.classList.remove('gone');},130);
  const fw=document.getElementById('figwrap');
  fw.innerHTML='<img class="'+(d.round?'round':'')+'" src="'+d.fig+'" alt="">';
  document.getElementById('wNo').textContent=d.no;
  document.getElementById('wName').textContent=d.name;
  document.getElementById('wDoes').textContent=d.does;
  document.getElementById('wSay').textContent=d.say;
  document.getElementById('wFacts').innerHTML=d.facts.map(([k,v])=>'<span>'+k+' <b>'+v+'</b></span>').join('');
  document.getElementById('foot').textContent=d.name+' · '+d.facts[2][1]+' aboard';
  document.title=d.name+' — Station packet 7';
  layout();
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')pick(cur+1);
  if(e.key==='ArrowLeft')pick(cur-1);
});
window.addEventListener('resize',layout);
pick(0);
</script>
</body>
</html>
