<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Compass — Station packet 2</title>
<style>
  @font-face{font-family:"Fraunces";src:url("assets/fraunces-italic-latin.woff2") format("woff2");font-style:italic;font-weight:400}
  @font-face{font-family:"Fraunces";src:url("assets/fraunces-normal-latin.woff2") format("woff2");font-style:normal;font-weight:400}
  :root{--ink:#f2efe8;--dim:#b9b4a8;--faint:#8a857a;--teal:#7fd0c8;--gold:#c9ad6b;
        --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .plate{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0;
    opacity:0;transition:opacity .7s ease}
  .plate.on{opacity:1}
  .plates{position:fixed;inset:0;z-index:0}
  .vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(78% 68% at 50% 46%,rgba(5,7,10,.12),rgba(5,7,10,.72) 62%,rgba(5,7,10,.96));
    box-shadow:inset 0 0 180px rgba(0,0,0,.85)}
  @media (prefers-reduced-motion:reduce){.plate{transition:none}}
  .chrome{position:fixed;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;
    padding:10px 18px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
  .top{top:0} .bot{bottom:0;color:var(--faint)}
  .brand{color:var(--teal)} .pkt{color:var(--gold)}
  /* dial */
  .dial{position:fixed;left:50%;top:50%;width:min(92vmin,660px);height:min(92vmin,660px);
    transform:translate(-50%,-50%);z-index:3}
  .tick{position:absolute;left:calc(50% + cos(var(--a)) * 50%);top:calc(50% + sin(var(--a)) * 50%);
    transform:translate(-50%,-50%);width:52px;height:44px;background:none;border:0;
    color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0}
  .tick i{display:block;width:2px;height:16px;background:currentColor;transition:height .2s,background .2s}
  .tick span{position:absolute;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    white-space:nowrap;left:calc(50% + cos(var(--a)) * 36px);top:calc(50% + sin(var(--a)) * 36px);
    transform:translate(-50%,-50%)}
  .tick:hover i,.tick:focus-visible i{height:20px;background:var(--teal)}
  .tick:focus-visible{outline:2px solid var(--teal);outline-offset:0}
  .tick[aria-current="true"]{color:var(--ink)}
  .tick[aria-current="true"] i{height:26px;background:var(--gold)}
  .tick span{opacity:.75}
  .tick[aria-current="true"] span{opacity:1;color:var(--gold)}
  .inner{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
  .inner2{position:absolute;inset:26%;border-radius:50%;border:1px dashed rgba(127,208,200,.22)}
  .needle{display:none}
  /* figure + words */
  .figure{position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);z-index:3;pointer-events:none;
    display:flex;align-items:flex-end;gap:2vw}
  .figure img.lead{width:min(23vw,215px);max-height:29vh;object-fit:contain;height:auto;
    filter:drop-shadow(0 22px 44px rgba(0,0,0,.8))}
  .figure img.core{width:min(10vw,88px);max-height:15vh;object-fit:contain;opacity:.9}
  .words{position:fixed;left:50%;top:19%;transform:translateX(-50%);
    z-index:4;text-align:center;width:min(58vw,410px)}
  .words .say{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:clamp(20px,3.4vw,31px);margin:0;
    text-shadow:0 3px 20px rgba(0,0,0,.9)}
  .words .does{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin:10px 0 0}
  .words .status{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:6px 0 0}
  @media (max-width:820px){
    .dial{width:94vw;height:94vw}
    .tick span{display:none}
    .figure img.lead{width:38vw;max-height:24vh}
    .words{top:11%;width:88vw}
  }
  .hint{position:fixed;right:18px;bottom:44px;z-index:6;font-family:var(--mono);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .hint b{color:var(--teal);font-weight:400}
@media (max-width:640px){.chrome{font-size:10px;letter-spacing:.08em;gap:10px}
    .pkt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;text-align:right}}
</style>
</head>
<body>
<div class="plates" id="plates" aria-hidden="true"></div>
<div class="vig"></div>

<div class="chrome top"><span class="brand">✦ Project Worlds</span><span class="pkt">Packet 2 / 8 · The Compass</span></div>
<div class="chrome bot"><span id="deckname">The Bridge</span><span>← → to turn the dial</span></div>

<div class="dial" id="dial" role="listbox" aria-label="Station decks">
  <div class="inner" aria-hidden="true"></div><div class="inner2" aria-hidden="true"></div>
  <div class="needle" id="needle" aria-hidden="true"></div>
</div>

<div class="words" aria-live="polite">
  <p class="say" id="say">Good evening. Nothing needs you right now.</p>
  <p class="does" id="does">what needs you</p>
  <p class="status" id="stat">quiet · nothing to do</p>
</div>

<div class="figure" id="figure" aria-hidden="true"></div>
<div class="hint">Tap a <b>tick</b> to move</div>

<script>
const DECKS=[
 {id:'bridge',name:'The Bridge',does:'what needs you',bg:'../assets/station/backgrounds/bridgebg.png',
   say:'Good evening. Nothing needs you right now.',stat:'quiet · nothing to do',
   imgs:[['../assets/station/characters/renai.png','lead'],['../assets/crew/cutouts/personal-world.png','core']]},
 {id:'engineering',name:'Engineering',does:'systems & capabilities',bg:'../assets/station/backgrounds/engineeringbg.png',
   say:'Everything is holding. I tightened a thing you will never notice.',stat:'healthy · 2 providers',
   imgs:[['../assets/station/characters/hekek.png','lead']]},
 {id:'workshop',name:'The Workshop',does:'making things',bg:'../assets/station/backgrounds/placesbg.png',
   say:'Two on the bench. One of them is being stubborn, which I respect.',stat:'2 in flight · 1 quiet',
   imgs:[['../assets/station/characters/bolt.png','lead']]},
 {id:'archives',name:'The Archives',does:'memory & lore',bg:'../assets/station/backgrounds/maproom.png',
   say:'I found the thread you lost. It was two entries back, where you left it.',stat:'current · 2 new entries',
   imgs:[['../assets/station/characters/ratatoskr.png','lead']]},
 {id:'galley',name:'The Galley',does:'stories & news',bg:'../assets/station/backgrounds/mediabg.png',
   say:'Truck is parked. Two stories came home. Neither one is shouting.',stat:'nothing breaking · 2 stories',
   imgs:[['../assets/station/characters/burrito.png','lead']]},
 {id:'observatory',name:'The Observatory',does:'the map of your world',bg:'../assets/station/backgrounds/observeatorybg.png',
   say:'I forgot the name, but I remember the shape. Come and look.',stat:'patterns quiet · 3 signals',
   imgs:[['../assets/station/characters/mira.png','lead']]},
 {id:'vault',name:'The Vault',does:'secrets & backups',bg:'../assets/station/backgrounds/vaultbg.png',
   say:'I kept that safe for you. Everything has its provenance. Nothing is lost.',stat:'preserved · provenance complete',
   imgs:[['../assets/station/characters/bruma.png','lead']]},
 {id:'quarters',name:'Your Quarters',does:'rest & profile',bg:'../assets/station/backgrounds/quarters.png',
   say:'The door is yours. No one lives here unless you ask them to.',stat:'quiet · motion reduced',
   imgs:[['../assets/station/icons/bedicon.png','core']]}
];
const plates=document.getElementById('plates');
DECKS.forEach(d=>{const el=document.createElement('div');el.className='plate';el.style.backgroundImage="url('"+d.bg+"')";plates.appendChild(el);});
const dial=document.getElementById('dial'),needle=document.getElementById('needle');
const ticks=[];
DECKS.forEach((d,i)=>{
  const a=(i*45-90);
  const b=document.createElement('button');
  b.type='button';b.className='tick';b.setAttribute('role','option');
  b.style.setProperty('--a',a+'deg');
  b.style.setProperty('--rot',a+'deg');
  b.style.setProperty('--unrot',(-a)+'deg');
  b.setAttribute('aria-label',d.name+', '+d.does);
  b.innerHTML='<i></i><span>'+d.name.replace('The ','')+'</span>';
  b.addEventListener('click',()=>show(i));
  dial.appendChild(b);ticks.push(b);
});
let cur=-1;
function show(i){
  if(i===cur)return;
  cur=(i+DECKS.length)%DECKS.length;
  const d=DECKS[cur];
  document.querySelectorAll('.plate').forEach((p,k)=>p.classList.toggle('on',k===cur));
  ticks.forEach((t,k)=>t.setAttribute('aria-current',k===cur?'true':'false'));
  document.getElementById('say').textContent=d.say;
  document.getElementById('does').textContent=d.does;
  document.getElementById('stat').textContent=d.stat;
  document.getElementById('deckname').textContent=d.name;
  needle.style.transform='translateX(-50%) rotate('+((cur*45-90)+90)+'deg)';
  document.getElementById('figure').innerHTML=d.imgs.map(([src,cl])=>'<img class="'+cl+'" src="'+src+'" alt="">').join('');
  document.title=d.name+' — Station packet 2';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){show(cur+1);}
  if(e.key==='ArrowLeft'){show(cur-1);}
});
show(0);
</script>
</body>
</html>
