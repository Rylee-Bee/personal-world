<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shelves — Station packet 3</title>
<style>
  @font-face{font-family:"Fraunces";src:url("assets/fraunces-italic-latin.woff2") format("woff2");font-style:italic;font-weight:400}
  @font-face{font-family:"Fraunces";src:url("assets/fraunces-normal-latin.woff2") format("woff2");font-style:normal;font-weight:400}
  :root{--ink:#f1ece1;--dim:#b0a794;--faint:#837b69;--line:rgba(241,236,225,.14);
        --teal:#7fd0c8;--gold:#cfa963;--wood:#120e0a;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--wood);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  body{display:grid;grid-template-rows:auto 1fr}
  .chrome{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    border-bottom:1px solid var(--line);background:rgba(18,14,10,.9)}
  .brand{color:var(--gold)} .pkt{color:var(--teal)}
  /* the crate */
  .crate{position:relative;padding:22px 20px 14px;background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),
    radial-gradient(120% 90% at 50% 0%,rgba(207,169,99,.09),transparent 60%),#150f0a}
  .crate::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
    background:linear-gradient(180deg,rgba(207,169,99,.28),rgba(0,0,0,.5));border-top:1px solid rgba(207,169,99,.3)}
  .spines{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
  .spine{position:relative;flex:0 0 auto;width:56px;height:230px;border:0;border-radius:4px 4px 3px 3px;
    cursor:pointer;color:#12100c;background:var(--spine,#8a8a8a);padding:10px 0;
    box-shadow:inset -8px 0 12px rgba(0,0,0,.28),inset 3px 0 6px rgba(255,255,255,.14),0 8px 16px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
  .spine .t{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:12.5px;
    letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:#13110d;font-weight:600}
  .spine img{width:30px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .spine.round img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:center 22%;border:1px solid rgba(0,0,0,.3)}
  .spine .band{width:100%;height:8px;display:flex}
  .spine .band i{flex:1}
  .spine[aria-pressed="true"]{transform:translateY(-14px);box-shadow:inset -8px 0 12px rgba(0,0,0,.3),0 0 0 2px var(--gold),0 14px 22px rgba(0,0,0,.6)}
  .spine:hover{transform:translateY(-8px)}
  .spine:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .crate .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--faint);margin:0 0 10px}
  /* the plate */
  .plate{position:relative;overflow:hidden;background:#0b0906}
  .plate .bg{position:absolute;inset:0;background-size:cover;background-position:center;
    transform:scale(1.03);transition:opacity .5s ease}
  .plate .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(11,9,6,.92) 0%,rgba(11,9,6,.72) 38%,rgba(11,9,6,.18) 68%,rgba(11,9,6,.5) 100%)}
  @media (prefers-reduced-motion:reduce){.plate .bg{transition:none}}
  .plate .cut{position:absolute;right:5%;bottom:0;height:92%;width:auto;max-width:44%;
    object-fit:contain;object-position:bottom;z-index:2;filter:drop-shadow(0 20px 40px rgba(0,0,0,.85))}
  .plate .cut.sm{height:56%;right:9%}
  .sheet{position:relative;z-index:3;max-width:min(560px,62%);padding:40px 22px 80px 44px;height:100%;
    display:flex;flex-direction:column;justify-content:center;gap:6px}
  .sheet .no{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  .sheet h2{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:clamp(32px,5.2vw,54px);margin:2px 0 0}
  .sheet .does{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:clamp(17px,2.2vw,22px);
    color:var(--dim);margin:2px 0 14px}
  .sheet .say{font-size:17px;color:#e6e0d2;max-width:42ch;margin:0 0 18px}
  .sheet ul{list-style:none;margin:0;padding:0;display:grid;gap:1px;max-width:420px}
  .sheet li{display:flex;gap:12px;justify-content:space-between;padding:9px 2px;border-top:1px solid var(--line);
    font-size:14.5px;color:#dcd5c6}
  .sheet li b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--teal);font-weight:400;white-space:nowrap}
  .sheet .who{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sheet .who img{width:34px;height:34px;object-fit:contain}
  .sheet .who img.round{border-radius:50%;object-fit:cover;object-position:center 22%;border:1px solid var(--line)}
  .foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:9px 18px;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    background:rgba(11,9,6,.85);border-top:1px solid var(--line);z-index:5}
  @media (max-width:760px){
    .spine{height:170px;width:48px}
    .spine .t{font-size:11px}
    .sheet{max-width:100%;padding:24px 18px 70px}
    .plate .cut{height:38%;right:2%;opacity:.85}
    .plate .bg::after{background:linear-gradient(180deg,rgba(11,9,6,.82),rgba(11,9,6,.9) 55%,rgba(11,9,6,.6))}
    body{overflow:auto}
    .plate{min-height:70vh}
  }
@media (max-width:640px){.chrome{font-size:10px;letter-spacing:.08em;gap:10px}
    .pkt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;text-align:right}}
</style>
</head>
<body>
<div class="chrome"><span class="brand">✦ Project Worlds</span><span>Pull a spine</span><span class="pkt">Packet 3 / 8 · The Shelves</span></div>

<div class="crate">
  <p class="label">The Station · eight decks, and the core</p>
  <div class="spines" id="spines" role="group" aria-label="Station decks"></div>
</div>

<div class="plate" id="plate">
  <div class="bg" id="bg" aria-hidden="true"></div>
  <img class="cut" id="cut" src="" alt="">
  <div class="sheet">
    <p class="no" id="no">Deck One</p>
    <h2 id="name">The Bridge</h2>
    <p class="does" id="does">what needs you</p>
    <p class="say" id="say"></p>
    <ul id="facts"></ul>
    <p class="who" id="who" style="margin-top:18px"></p>
  </div>
</div>

<div class="foot"><span id="foot">selected: The Bridge</span><span>L / R to leaf through</span></div>

<script>
const DECKS=[
 {id:'bridge',no:'Deck One',name:'The Bridge',does:'what needs you',spine:'#8fc9c2',
   bg:'../assets/station/backgrounds/bridgebg.png',who:'Renai',whoImg:'../assets/station/characters/renai.png',
   say:'Good evening. Nothing needs you right now. The windows are open and the station has been keeping its own counsel.',
   facts:[['State','quiet'],['Needs you','nothing'],['Changed today','3']]},
 {id:'engineering',no:'Deck Two',name:'Engineering',does:'systems & capabilities',spine:'#d9a76b',
   bg:'../assets/station/backgrounds/engineeringbg.png',who:'Hekek',whoImg:'../assets/station/characters/hekek.png',
   say:'Hekek does not tidy — Hekek maintains. Everything has been taken apart and put back at least once this year, and came back better.',
   facts:[['Capabilities','healthy'],['Providers','2'],['Lab bridge','read-only']]},
 {id:'workshop',no:'Deck Three',name:'The Workshop',does:'making things',spine:'#c98f6a',
   bg:'../assets/station/backgrounds/placesbg.png',who:'Bolt',whoImg:'../assets/station/characters/bolt.png',
   say:'Two on the bench, one of them stubborn. Garden Atlas is not abandoned; it is waiting for spring, which is a legitimate way to work.',
   facts:[['In flight','2'],['Quiet','1'],['Bench','Bolt']]},
 {id:'archives',no:'Deck Four',name:'The Archives',does:'memory & lore',spine:'#b39a63',
   bg:'../assets/station/backgrounds/maproom.png',who:'Ratatoskr',whoImg:'../assets/station/characters/ratatoskr.png',
   say:'Ratatoskr runs the threads — not the facts, the threads between the facts, which is the more interesting job.',
   facts:[['Memory','current'],['New entries','2'],['Keeper','Ratatoskr']]},
 {id:'galley',no:'Deck Five',name:'The Galley',does:'stories & news',spine:'#c47a55',
   bg:'../assets/station/backgrounds/mediabg.png',who:'Burrito Journalism',whoImg:'../assets/station/characters/burrito.png',
   say:'Truck is parked. Two stories came home. Neither one is shouting, which the truck takes personally.',
   facts:[['Breaking','nothing'],['Stories','2'],['Parked','yes']]},
 {id:'observatory',no:'Deck Six',name:'The Observatory',does:'the map of your world',spine:'#8a9fc9',
   bg:'../assets/station/backgrounds/observeatorybg.png',who:'Mira',whoImg:'../assets/station/characters/mira.png',
   say:'Three signals in the same region this week. Either a coincidence or the beginning of a pattern — and this room exists to sit with that.',
   facts:[['Patterns','quiet'],['Signals','3'],['Watching','Mira']]},
 {id:'vault',no:'Deck Seven',name:'The Vault',does:'secrets & backups',spine:'#9c8fb0',
   bg:'../assets/station/backgrounds/vaultbg.png',who:'Bruma',whoImg:'../assets/station/characters/bruma.png',
   say:'Fourteen world-lore entries, three seasons of records, this week\u2019s notes. Every one has a provenance line, because a thing you cannot trace is a thing you cannot trust.',
   facts:[['Preservation','current'],['Provenance','complete'],['Keeper','Bruma']]},
 {id:'quarters',no:'Deck Eight',name:'Your Quarters',does:'rest & profile',spine:'#8d8d8d',sm:true,
   bg:'../assets/station/backgrounds/quarters.png',who:'No resident — the bed icon',whoImg:'../assets/station/icons/bedicon.png',
   say:'The bed icon is deliberate: Quarters is not a job, so it has no resident. The door is yours, and who lives here (if anyone) is a setting.',
   facts:[['Resident','none, by choice'],['Motion','reduced'],['Door','yours']]},
 {id:'core',no:'The Core',name:'Personal World',does:'the station itself',spine:'#7fd0c8',sm:true,
   bg:'assets/worlds/sky2.jpg',who:'Personal World',whoImg:'../assets/crew/cutouts/personal-world.png',
   say:'Under everything: one world, many rooms. The Station is not a dashboard — it is a place you live in.',
   facts:[['World','one'],['Rooms','eight'],['Residents','a roster']]}
];
const spines=document.getElementById('spines');
const TINT=['#e8d9b8','#7fd0c8','#cfa963'];
const btns=[];
DECKS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='spine'+(d.round?' round':'');
  b.style.setProperty('--spine',d.spine);
  b.setAttribute('aria-pressed','false');
  b.setAttribute('aria-label',d.name+', '+d.does);
  b.innerHTML='<img src="'+d.whoImg+'" alt=""><span class="t">'+d.name+'</span>'+
    '<span class="band"><i style="background:'+TINT[0]+'"></i><i style="background:'+TINT[1]+'"></i><i style="background:'+TINT[2]+'"></i></span>';
  b.addEventListener('click',()=>pick(i));
  spines.appendChild(b);btns.push(b);
});
let cur=-1;
function pick(i){
  cur=i;const d=DECKS[i];
  btns.forEach((b,k)=>b.setAttribute('aria-pressed',k===i?'true':'false'));
  const bg=document.getElementById('bg');
  bg.style.opacity=0;
  setTimeout(()=>{bg.style.backgroundImage="url('"+d.bg+"')";bg.style.opacity=1;},120);
  const cut=document.getElementById('cut');
  cut.src=d.whoImg;cut.className='cut'+(d.sm?' sm':'')+(d.round?'':'');cut.alt=d.who;
  if(d.round)cut.style.borderRadius='50%',cut.style.objectFit='cover',cut.style.objectPosition='center 22%';
  else cut.style.borderRadius='',cut.style.objectFit='contain',cut.style.objectPosition='bottom';
  document.getElementById('no').textContent=d.no;
  document.getElementById('name').textContent=d.name;
  document.getElementById('does').textContent=d.does;
  document.getElementById('say').textContent=d.say;
  document.getElementById('facts').innerHTML=d.facts.map(([k,v])=>'<li><span>'+k+'</span><b>'+v+'</b></li>').join('');
  document.getElementById('who').innerHTML='<img class="'+(d.round?'round':'')+'" src="'+d.whoImg+'" alt=""> '+d.who;
  document.getElementById('foot').textContent='selected: '+d.name;
  document.title=d.name+' — Station packet 3';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')pick((cur+1)%DECKS.length);
  if(e.key==='ArrowLeft')pick((cur-1+DECKS.length)%DECKS.length);
});
pick(0);
</script>
</body>
</html>
