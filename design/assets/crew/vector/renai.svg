<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" role="img" aria-labelledby="title desc">
<title id="title">Renai</title><desc id="desc">Clean Project Worlds vector artwork. Pure SVG geometry; no embedded raster.</desc>
