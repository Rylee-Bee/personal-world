<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Companion silhouettes. Single-colour iconography (currentColor),
       deliberately NOT emoji and NOT detailed illustration.
       They read as quiet marks, not characters demanding attention.
       Redesigned 2026-09-16: minimal silhouettes per owner direction. -->

  <!-- The World: a ringed planet -->
  <symbol id="char-world" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="6.2" fill="currentColor"/>
    <ellipse cx="12" cy="12" rx="10.4" ry="2.8" fill="none" stroke="currentColor"
             stroke-width="1.3" transform="rotate(-18 12 12)"/>
  </symbol>

  <!-- Mermaid: a tail-fluke, the sea's mark -->
  <symbol id="char-mermaid" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 21c0-5.2 1.1-8.4 0-12.6 2.1 2.1 5.2 3.1 8.3 2.1-1.6 3.1-4.2 4.7-6.8 4.7 2.4 1.6 1.4 3.7-1.5 5.8z"/>
    <path fill="currentColor" d="M12 21c0-5.2-1.1-8.4 0-12.6-2.1 2.1-5.2 3.1-8.3 2.1 1.6 3.1 4.2 4.7 6.8 4.7-2.4 1.6-1.4 3.7 1.5 5.8z"/>
  </symbol>

  <!-- Ratatoskr: a squirrel — body, head, one big comma of a tail -->
  <symbol id="char-ratatoskr" viewBox="0 0 24 24">
    <circle cx="9.6" cy="15.2" r="4.4" fill="currentColor"/>
    <circle cx="9.6" cy="8.2" r="3" fill="currentColor"/>
    <path fill="currentColor" d="M13.8 20.4c4.1 0 6.7-2.9 6.7-6.4 0-3.1-2-5.4-4.7-6.1.9 1.2 1.5 2.8 1.5 4.4 0 3.4-1.7 6.3-4.5 8.1z"/>
    <path fill="currentColor" d="M7.4 5.6l.6-2.4 1.8 1.6z M11.8 5.6l-.6-2.4-1.8 1.6z"/>
  </symbol>

  <!-- Robot: a rounded head with one antenna -->
  <symbol id="char-robot" viewBox="0 0 24 24">
    <rect x="6" y="8.4" width="12" height="9.6" rx="3.4" fill="currentColor"/>
    <line x1="12" y1="8.4" x2="12" y2="5.2" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="12" cy="4" r="1.6" fill="currentColor"/>
  </symbol>

  <!-- Burrito Journalism: the van -->
  <symbol id="char-burrito" viewBox="0 0 24 24">
    <path fill="currentColor" d="M3 8h12.6v7H3z"/>
    <path fill="currentColor" d="M15.6 10h2.8l2.6 3v2h-5.4z"/>
    <circle cx="7" cy="16.6" r="1.9" fill="currentColor"/>
    <circle cx="16.4" cy="16.6" r="1.9" fill="currentColor"/>
  </symbol>
</svg>
