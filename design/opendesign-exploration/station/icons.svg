<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- ICON SYSTEM — planet faces & interest glyphs.
       Simple line glyphs in currentColor: charming at small size, legible,
       and consistent with the silhouette companion language. NOT emoji.
       Icons are DECORATIVE: every body also carries a visible text label and
       a full accessible name, so meaning never rides on the picture alone. -->

  <symbol id="ic-brain" viewBox="0 0 24 24">
    <path d="M12 4a5 5 0 0 0-5 5c-2 .5-3 2-3 4 0 2.5 2 4 4 4h8c2 0 4-1.5 4-4 0-2-1-3.5-3-4a5 5 0 0 0-5-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M12 4v13 M9 10h2 M13 13h2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

