# Project Worlds adoption manifest (broad adoption)
# Follows the Play-Nice project-context layout and the library's
# examples/personal-world.adoption.yaml. Projects consume contracts; they do
# not fork them. Project-specific contracts (companion integration,
# finish-line product rules, setup-wizard flows, etc.) stay local to the
# Project Worlds repository.
schema: play-nice/adoption-v1
project: personal-world
source:
  repository: Rylee-Bee/play-nice-contracts   # renamed from burgeswe/play-nice-contracts (account rename, 2026-09-12); old URL redirects
  revision: 60eaeab12cf13d4dc5d6f66eb7a6c6b069fb453e   # play-nice-contracts main 2026-09-25 (VERSION 0.10.0); fast-forward from 44ec8f4, read before pinning
  # Bump history: 2bb60b4 (v0.3.0) -> d6c97db (v0.5.0) -> 0cee065
  # (v0.6.0) -> f825ffb (v0.7.0, 2026-09-15). Each bump verified against the
  # live repository (commit exists, VERSION/CHANGELOG match,
  # contracts.lock.json fetched and diffed against the previous pin) before
  # pinning — never taken on assertion. -> a0e3efb (2026-09-20 repin after
  # upstream identity rewrite — ATTESTATION GAP: v0.8.0/v0.9.0 contract bumps
  # entered unreviewed) -> 44ec8f4 (2026-09-21 ratified forward after full
  # read + re-attestation; set content-identical to a0e3efb)
  # v0.8.0–v0.10.0 delta: seven MINOR receipt-rotated contracts —
  # human-reliability 1.1->1.2, contract-attestation 1.1->1.2, agent-behavior
  # 1.0->1.1, copy-and-language 1.0->1.1, documentation-and-continuity
  # 1.0->1.1, failure-and-degradation 1.0->1.1, progressive-disclosure
  # 1.0->1.1. Provenance: v0.8.0 readability edits originated from Project
  # Worlds' own 2026-09-17 pass; v0.9.0 added freshness/sync machinery;
  # v0.10.0 orchestrator-only, no contract text. Un-versioned pointer-only
  # cross-reference edits also landed in-window on what-why-next 1.0.0 and
  # migraine-and-sensory-safety 1.0.0 (progress-and-closure likewise; not
  # adopted here).
  # -> 60eaeab (2026-09-25, owner-requested refresh after the contract-freshness
  # check reported DIVERGED on PR #65). Verified fast-forward from 44ec8f4
  # (merge-base --is-ancestor). One contract text change: contract-attestation
  # 1.2.0 -> 1.3.0 (receipt quartz-rill-ember -> flint-meadow-anchor), which
  # adds rule 27, freshness equivalence, for `update: automatic` only. This
  # manifest is pinned, so the rule doesn't apply here. All other upstream
  # changes are tooling, tests and docs (contractctl adopter toolkit,
  # check.sh). Historical session receipts keep their old receipt values.

