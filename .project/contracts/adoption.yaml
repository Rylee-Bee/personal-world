# Project Worlds adoption manifest (broad adoption)
# Follows the Play-Nice project-context layout and the library's
# examples/personal-world.adoption.yaml. Projects consume contracts; they do
# not fork them. Project-specific contracts (companion integration,
# finish-line product rules, setup-wizard flows, etc.) stay local to the
# Project Worlds repository.
schema: play-nice/adoption-v1
project: personal-world
source:
  repository: Rylee-Bee/play-nice-contracts   # renamed from burgeswe/play-nice-contracts (account rename, 2026-09-12); old URL redirects
  revision: 79cadaceb8654279f7b2be135fcd67ba138728fb   # play-nice-contracts v0.7.0 (library HEAD at adoption)
  # Bump history: 0c0ab7c5 (v0.3.0) -> 805f58b46f (v0.5.0) -> 21b6841a
  # (v0.6.0) -> 79cadac (v0.7.0, 2026-09-15). Each bump verified against the
  # live repository (commit exists, VERSION/CHANGELOG match,
  # contracts.lock.json fetched and diffed against the previous pin) before
  # pinning — never taken on assertion.
  # v0.7.0 delta: new always-applicable `assume-unknown` contract; founding
  # `play-nice-together` 1.5.0 -> 1.6.0 with its receipt rotated. No other
  # adopted contract changed meaning. Consumers re-pin and re-attest.

always:
  - assume-unknown                   # new in v0.7.0; always-applicable
  - ask-for-help
  - truth-and-evidence
  - human-reliability
  - recovery-and-reversibility
  - provenance-and-audit
  - explicit-state
  - stable-truth-replaceable-machinery
  - participation-and-contribution
  - mutual-contribution
  - collaborative-good-faith

triggers:
  human-facing:
    - accessibility-floor
    - attention-and-focus
    - complexity-on-demand
    - what-why-next
    - quiet-when-healthy
    - progressive-disclosure
    - guide-me
    - copy-and-language
  ui:
    - low-vision-and-reflow
    - migraine-and-sensory-safety
    - themes-and-personalization
    - motion-and-feedback
    - web-ui
    - visual-fidelity-and-composition
  design:
    - design-source-and-fidelity
    - visual-fidelity-and-composition
  external-api:
    - capability-first
    - friendly-api-client
    - provider-neutrality
    - discovery-and-negotiation
    - idempotency
    - polling-webhooks-and-caching
    - external-mutations
  api:
    - api
    - versioning-and-compatibility
    - failure-and-degradation
    - machine-readable-output
    - human-and-machine-parity
  cli:
    - cli
  security:
    - authorization
    - authentication
    - secrets
    - data-classification
    - public-private-boundaries
    - least-privilege
  agent:
    - agent-behavior
    - bounded-work
    - orchestration
    - worker-contract
    - review-and-integration
    - handoff
    - contract-attestation
    - model-routing
  engineering:
    - deterministic-first
    - search-before-inventing
    - testing-and-verification
    - dependency-discipline
    - git-and-worktrees
    - documentation-and-continuity
    - migrations
    - observability

notes: >-
  Broad adoption: Project Worlds is human-facing, provider-rich, agent-built,
  and design-heavy, so nearly the full library applies. Companion/theme
  product rules and the finish-line document remain local; this manifest
  governs only the shared floors.