# Project Worlds — portable standalone deployment.
#
# Product formerly "Personal World"; service identifiers unchanged.
#
# This compose file is the portable appliance. It pulls the published
# GHCR image; it carries no host-specific mounts, no homelab checkout,
# no Kilo auth file, and no WSL paths. It boots with only:
#
#   - a published OCI image
#   - a persistent world-data volume
#   - the required PW_API_TOKEN
#   - one published port (8000)
#
# Machine-specific integrations (homelab Lab CLI, Kilo auth file) live
# in compose.homelab.yaml and are opt-in enrichment only. Local
# development with a source-tree build lives in compose.dev.yaml.
#
# Rollback by pinning PW_IMAGE to a known-good :sha-... tag (see
# docs/OPERATIONS.md).

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3:1.7b"]

  core:
    image: ${PW_IMAGE:-ghcr.io/rylee-bee/personal-world:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      # Auth boundary: fail-closed. Compose parses with no .env present
      # (config-time interpolation defaults to empty); runtime still
      # refuses to boot without a token -- see the Dockerfile CMD guard
      # and the healthcheck's auth_configured assertion. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      PW_API_TOKEN: ${PW_API_TOKEN:-}
      # Optional chat provider keys use env indirection; forwarded only
      # if set. The portable base does not bake any keys.
      XIAOMI_MIMO_API_KEY: ${XIAOMI_MIMO_API_KEY:-}
    volumes:
      - world-data:/data
    healthcheck:
      # Unhealthy (restarts) when auth is not configured: an empty
      # PW_API_TOKEN must never settle into a green container.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys,json; \
              r=urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4); \
              d=json.load(r); \
              sys.exit(0 if r.status==200 and d.get('auth_configured') is True else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  world-data:
  ollama-data: