name: validate

# Contract workflow — pipeline *mechanics* live in Rylee-Bee/ci-harness
# (workflow_call reusable templates; every action SHA is pinned in exactly
# one place: ci-harness/pins/ACTIONS.md). This file owns only this repo's
# *semantics*: which checks gate merges and with what arguments.
#
# Job-for-job parity with the previous hand-written pipeline:
#   test / compose / browser / security-gates / framework-gates.
# The compose job intentionally stays inline here: the compose-config check
# fits none of the three templates, and contorting a template to host it
# would be dishonest plumbing. See ci-harness README for adoption.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Heartbeat for the Play-Nice pin (the heart): weekly Monday check
    # that the adoption pin still reads CURRENT against upstream. GitHub
    # fires schedules only on the default branch; PRs re-check the same
    # job on every push. Detection automated, pin movement manual.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: Rylee-Bee/ci-harness/.github/workflows/reusable-python.yml@main
    with:
      sync-args: "--extra test --extra crypto"
      pytest-args: "--timeout=30"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # pin managed by ci-harness/pins/ACTIONS.md
        with:
          persist-credentials: false
      - name: Compose config validates
        run: |
          echo "PW_API_TOKEN=ci-placeholder-token" > .env
          docker compose config -q
      - name: Image builds (Station-only image; no frontend build stage)
        run: docker build -t personal-world:ci .

  browser:
    uses: Rylee-Bee/ci-harness/.github/workflows/reusable-node.yml@main
    with:
      working-directory: "frontend"
      setup-python: true
      sync-args: "--extra test"
      test-command: "npx playwright install --with-deps chromium && npx playwright test"
      upload-dist: false

  security-gates:
    uses: Rylee-Bee/ci-harness/.github/workflows/reusable-python.yml@main
    with:
      sync-args: "--extra test"
      pytest-args: '--timeout=30 tests/test_core.py -k "SettingsExportSafety or CementedPolicy or TestJournal or WorldExport" -v'

  framework-gates:
    uses: Rylee-Bee/ci-harness/.github/workflows/reusable-python.yml@main
    with:
      sync-args: "--extra test"
      pytest-args: "--timeout=30 tests/test_framework.py -v"
      post-test-commands: "uv run personal-world framework validate --json"

  # The heart, kept honest automatically: fails closed whenever the
  # ratified adoption pin drifts from Rylee-Bee/play-nice-contracts
  # (see .project/contracts/adoption.yaml bump history — movement is a
  # manual, attested ritual, never a sync).
  contract-freshness:
    uses: Rylee-Bee/ci-harness/.github/workflows/reusable-contract-freshness.yml@main
    with:
      manifest-path: ".project/contracts/adoption.yaml"
