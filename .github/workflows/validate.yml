name: validate

on:
  push:
    branches: [main, feat/station-vnext-foundation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test --extra crypto
      - name: Pytest
        run: uv run pytest --timeout=30

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose config validates
        run: |
          echo "PW_API_TOKEN=ci-placeholder-token" > .env
          docker compose config -q
      - name: Image builds (Station-only image; no frontend build stage)
        run: docker build -t personal-world:ci .

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (the e2e server boots the real app via uvicorn)
        run: pip install uv==0.11.28
      - name: Sync python deps (personal_world importable for uvicorn)
        run: uv sync --frozen --extra test
      - name: Install Playwright harness deps + Chromium
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright Station a11y / honest-state / keyboard / motion (real server)
        run: cd frontend && npx playwright test

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Leakage + cemented-policy + read-safety gates
        run: uv run pytest --timeout=30 tests/test_core.py -k "SettingsExportSafety or CementedPolicy or TestJournal or WorldExport" -v

  framework-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.28
      - name: Sync deps
        run: uv sync --frozen --extra test
      - name: Framework conformance (native baseline + optional enrichment)
        run: uv run pytest --timeout=30 tests/test_framework.py -v
      - name: Repo config passes its own framework validator
        run: uv run personal-world framework validate --json
